<!-- Modal -->
<div bsModal #releaseModal="bs-modal" class="modal fade" id="releaseModal" tabindex="-1" role="dialog"
  aria-labelledby="exampleModalLongTitle" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-primary" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="releaseModalTitle">Important Notice</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close" (click)="releaseModal.hide()">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <i
            class="fa fa-info-circle text-primary"
            aria-hidden="true"
            style="font-size: 3rem;"
          ></i>
        </div>

        <h4 class="mb-3">
          This website is no longer maintained
        </h4>

        <p class="text-muted mb-4">
          A newer version of the tool is now maintained by the
          <strong>spaceSuite project</strong>.
          Visit the new website to access the latest version.
        </p>

        <a
          href="https://spacesuite-job-offer-tool.web.app/"
          target="_blank"
          rel="noopener noreferrer"
          class="btn btn-primary btn-lg"
        >
          Visit the new website
          <i class="fa fa-external-link ml-2" aria-hidden="true"></i>
        </a>

        <p class="mt-3 mb-0 small text-muted">
          The new website will open in a new tab.
        </p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-primary" data-dismiss="modal" (click)="releaseModal.hide()">Close</button>
      </div>
    </div>
  </div>
</div>
